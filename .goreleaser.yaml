version: 2

builds:
  - main: ./cmd/qbo
    binary: qbo
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"

homebrew_casks:
  - name: qbo
    directory: Casks
    homepage: "https://github.com/voska/qbo-cli"
    description: "QuickBooks Online CLI for humans and AI agents"
    license: "MIT"
    url:
      verified: github.com/voska/qbo-cli
    repository:
      owner: voska
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: voska-bot
      email: bot@voska.dev
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/qbo"]
          end

scoops:
  - name: qbo
    homepage: "https://github.com/voska/qbo-cli"
    description: "QuickBooks Online CLI for humans and AI agents"
    license: "MIT"
    repository:
      owner: voska
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"

nfpms:
  - package_name: qbo
    homepage: "https://github.com/voska/qbo-cli"
    maintainer: "voska <hello@voska.dev>"
    description: "QuickBooks Online CLI for humans and AI agents"
    license: "MIT"
    formats:
      - deb
      - rpm
